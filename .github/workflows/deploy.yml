name: Build, Push & Deploy to AWS EC2 Docker Swarm

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-stack.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # =========================================================================
  # 1. Build and Push Microservice Images to GitHub Container Registry (GHCR)
  # =========================================================================
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: backend/api-gateway/Dockerfile
            image_name: deltix-api-gateway
          - service: agent-compiler-service
            dockerfile: backend/agent-compiler-service/Dockerfile
            image_name: deltix-agent-compiler-service
          - service: agent-runtime-service
            dockerfile: backend/agent-runtime-service/Dockerfile
            image_name: deltix-agent-runtime-service
          - service: agent-runtime-worker
            dockerfile: backend/agent-runtime-service/worker/Dockerfile
            image_name: deltix-agent-runtime-worker
          - service: capability-policy-service
            dockerfile: backend/capability-policy-service/Dockerfile
            image_name: deltix-capability-policy-service
          - service: memory-service
            dockerfile: backend/memory-service/Dockerfile
            image_name: deltix-memory-service

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name for Docker Tagging
        id: repo_name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LC }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # =========================================================================
  # 2. Deploy to AWS EC2 Docker Swarm via SSH
  # =========================================================================
  deploy-to-ec2:
    name: Deploy to EC2 Docker Swarm
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check if EC2 Deployment Secrets Exist
        id: check_secrets
        run: |
          if [ -n "${{ secrets.EC2_HOST }}" ] && [ -n "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "::warning::EC2_HOST or EC2_SSH_KEY not set. Images were built and pushed to GHCR, but remote deploy was skipped."
          fi

      - name: Copy docker-stack.yml to EC2
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-stack.yml"
          target: "/opt/deltix"

      - name: Deploy to Remote Docker Swarm via SSH
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "=== 1. Authenticating with GitHub Container Registry ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "=== 2. Setting Deployment Directory ==="
            cd /opt/deltix

            echo "=== 3. Exporting Environment Variables ==="
            REPO_LC="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
            export DOCKER_REGISTRY="ghcr.io/${REPO_LC}"
            export TAG="latest"

            echo "=== 4. Pulling Latest Images ==="
            docker pull "${DOCKER_REGISTRY}/deltix-api-gateway:${TAG}"
            docker pull "${DOCKER_REGISTRY}/deltix-agent-compiler-service:${TAG}"
            docker pull "${DOCKER_REGISTRY}/deltix-agent-runtime-service:${TAG}"
            docker pull "${DOCKER_REGISTRY}/deltix-agent-runtime-worker:${TAG}"
            docker pull "${DOCKER_REGISTRY}/deltix-capability-policy-service:${TAG}"
            docker pull "${DOCKER_REGISTRY}/deltix-memory-service:${TAG}"

            echo "=== 5. Deploying / Updating Docker Swarm Stack ==="
            docker stack deploy -c docker-stack.yml deltix --with-registry-auth

            echo "=== 6. Verification: Listing Swarm Services ==="
            docker service ls
